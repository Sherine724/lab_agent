; Project-local pip config (applies to lib_agent only).
;
; Why this file exists:
;   The global config at %APPDATA%\pip\pip.ini sets
;       target = D:/PythonPackages
;   which forces every `pip install` to drop packages into D:\PythonPackages
;   instead of the active virtual environment, making venvs useless.
;
;   This file is loaded via the PIP_CONFIG_FILE environment variable,
;   which bypasses that global `target` setting.
;
; NOTE: keep this file ASCII-only. pip decodes config files using the
;       system locale encoding (cp936 on Chinese Windows), so non-ASCII
;       comments cause "invalid cp936 characters" errors.
;
; Do NOT add a `target` key below.

[global]
index-url = https://mirrors.aliyun.com/pypi/simple
